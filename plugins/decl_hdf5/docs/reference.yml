# The examples of the Decl'HDF5 configuration reference (reference.md), that a sequential HDF5 runs, one whole specification tree per key, that the page shows the marked
# part of.
# The test of this directory runs each of them with pdi/docs/run_trees.cxx.

decl_hdf5_config:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  #! [decl_hdf5_config]
  plugins:
    decl_hdf5:            # <- a single file description...
      file: result.h5
      write: [field]
  #! [decl_hdf5_config]

decl_hdf5_config_sequence:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  #! [decl_hdf5_config_sequence]
  plugins:
    decl_hdf5:            # <- ... or a sequence of them, one per file
      - file: result.h5
        write: [field]
      - file: restart.h5
        read: [field]
  #! [decl_hdf5_config_sequence]

decl_hdf5_logging:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_logging]
      logging: debug          # <- only in the single file description form
      file: result.h5
      write: [field]
      #! [decl_hdf5_logging]

decl_hdf5_h5file:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  #! [decl_hdf5_h5file]
  plugins:
    decl_hdf5:
      file: checkpoint_${iter}.h5   # <- this mapping is a file description:
      on_event: checkpoint          #    which file, when it is accessed,
      write: [field, iter]          #    and what is written to it
  #! [decl_hdf5_h5file]

decl_hdf5_h5file_file:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_file]
      file: output_${iter}.h5   # <- evaluated at each access: output_0.h5, output_1.h5...
      write: [field]
      #! [decl_hdf5_h5file_file]

decl_hdf5_h5file_on_event:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_on_event]
      file: checkpoint.h5
      on_event: [checkpoint, finalization]   # <- the whole file is written on either event
      write: [field, iter]
      #! [decl_hdf5_h5file_on_event]

decl_hdf5_h5file_when:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_when]
      file: output.h5
      when: $iter % 10 = 0       # <- one iteration out of ten
      write:
        field: {dataset: 'field_${iter}'}
      #! [decl_hdf5_h5file_when]

decl_hdf5_h5file_datasets_dataset_regex:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_datasets_dataset_regex]
      file: history.h5
      datasets:
        field_history: {type: array, subtype: double, size: [$nb_iter, 64, 64]}   # <- one 3D dataset for all iterations
        'snapshot_[0-9]+': {type: array, subtype: float, size: [64, 64]}         # <- a regex: every snapshot_<n> dataset
      write:
        field:
          - dataset: field_history
            dataset_selection: {size: [1, 64, 64], start: [$iter, 0, 0]}
          - dataset: snapshot_${iter}
      #! [decl_hdf5_h5file_datasets_dataset_regex]

decl_hdf5_h5file_collision_policy:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_collision_policy]
      file: output_${iter}.h5
      collision_policy: error   # <- refuse to overwrite the files of a previous run
      write: [field]
      #! [decl_hdf5_h5file_collision_policy]

decl_hdf5_h5file_deflate:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_deflate]
      file: output.h5
      deflate: 6                # <- every dataset created in output.h5 is compressed
      write:
        field: {chunking: [16, 64]}
      #! [decl_hdf5_h5file_deflate]

decl_hdf5_h5file_fletcher:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_fletcher]
      file: output.h5
      fletcher: 1               # <- every dataset created in output.h5 gets a checksum
      write:
        field: {chunking: [16, 64]}
      #! [decl_hdf5_h5file_fletcher]

decl_hdf5_h5file_write_data_name:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_write_data_name]
      file: output.h5
      write:
        field:                  # <- field is written twice at each share:
          - dataset: field_last           # always to the same dataset,
          - dataset: field_${iter}        # and every 10 iterations to its own one
            when: $iter % 10 = 0
      #! [decl_hdf5_h5file_write_data_name]

decl_hdf5_h5file_write_item:
  data:   # iter after field, whose dataset holds its attribute
    field: {type: array, subtype: double, size: [64, 64]}
    iter: int
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_write_item]
      file: output.h5
      write: [field, field#iter]   # <- field to the field dataset, iter to its iter attribute
      #! [decl_hdf5_h5file_write_item]

decl_hdf5_h5file_read_data_name:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_read_data_name]
      file: restart.h5
      read:
        field:                  # <- field is read from another dataset than its name
          dataset: initial_field
      #! [decl_hdf5_h5file_read_data_name]

decl_hdf5_h5file_read_item:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5file_read_item]
      file: restart.h5
      read: [field, field#iter]   # <- field from the field dataset, iter from its iter attribute
      #! [decl_hdf5_h5file_read_item]

decl_hdf5_h5io:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      #! [decl_hdf5_h5io]
      file: output.h5
      datasets:
        data/field: {type: array, subtype: double, size: [62, 62]}
      write:
        field:                  # <- this mapping is an I/O description
          dataset: data/field
          when: $iter > 0
          memory_selection: {size: [62, 62], start: [1, 1]}
      #! [decl_hdf5_h5io]

decl_hdf5_h5io_dataset:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      write:
        field:
          #! [decl_hdf5_h5io_dataset]
          dataset: group/field_${iter}   # <- one dataset per iteration, in group/
          #! [decl_hdf5_h5io_dataset]

decl_hdf5_h5io_attribute:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      on_event: output
      write:
        field: ~
        iter:
          #! [decl_hdf5_h5io_attribute]
          attribute: field#iteration   # <- the data is written to the iteration attribute of the field dataset
          #! [decl_hdf5_h5io_attribute]

decl_hdf5_h5io_when:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      write:
        field:
          #! [decl_hdf5_h5io_when]
          dataset: field_${iter}
          when: $iter > 0           # <- replaces the condition of the file, if any
          #! [decl_hdf5_h5io_when]

decl_hdf5_h5io_memory_selection:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      datasets:
        field: {type: array, subtype: double, size: [62, 62]}
      write:
        field:
          #! [decl_hdf5_h5io_memory_selection]
          memory_selection:         # <- the 62x62 interior of a 64x64 field, without its ghost cells
            size: [62, 62]
            start: [1, 1]
          #! [decl_hdf5_h5io_memory_selection]

decl_hdf5_h5io_dataset_selection:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      datasets:
        field_history: {type: array, subtype: double, size: [10, 64, 64]}
      write:
        field:
          #! [decl_hdf5_h5io_dataset_selection]
          dataset: field_history
          dataset_selection:        # <- the slice of a 3D dataset, defined in datasets, for this iteration
            size: [1, 64, 64]
            start: [$iter, 0, 0]
          #! [decl_hdf5_h5io_dataset_selection]

decl_hdf5_h5io_attributes_attribute_name:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      write:
        field:
          #! [decl_hdf5_h5io_attributes_attribute_name]
          dataset: field
          attributes:
            iteration: $iter        # <- the field dataset gets an iteration attribute
          #! [decl_hdf5_h5io_attributes_attribute_name]

decl_hdf5_h5io_collision_policy:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      write:
        field:
          #! [decl_hdf5_h5io_collision_policy]
          dataset: field
          collision_policy: skip_and_warn   # <- keep the first value written, warn at the next ones
          #! [decl_hdf5_h5io_collision_policy]

decl_hdf5_h5io_chunking:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      write:
        field:
          #! [decl_hdf5_h5io_chunking]
          dataset: field
          chunking: [16, 64]        # <- stored in chunks of 16x64 elements, which compression needs
          deflate: 6
          #! [decl_hdf5_h5io_chunking]

decl_hdf5_h5io_deflate:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      deflate: 6
      write:
        field:
          #! [decl_hdf5_h5io_deflate]
          dataset: field
          chunking: [16, 64]
          deflate: 9                # <- overrides the level of the file
          #! [decl_hdf5_h5io_deflate]

decl_hdf5_h5io_fletcher:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      write:
        field:
          #! [decl_hdf5_h5io_fletcher]
          dataset: field
          chunking: [16, 64]
          fletcher: 1               # <- this dataset gets a checksum
          #! [decl_hdf5_h5io_fletcher]

decl_hdf5_h5io_size_of:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
    field_size: {type: array, subtype: int64, size: 2}
  plugins:
    decl_hdf5:
      file: restart.h5
      read:
        field_size:
          #! [decl_hdf5_h5io_size_of]
          size_of: field            # <- reads the dimensions of the field dataset
          #! [decl_hdf5_h5io_size_of]

decl_hdf5_h5selection:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      datasets:
        field: {type: array, subtype: double, size: [62, 62]}
      write:
        field:
          #! [decl_hdf5_h5selection]
          dataset: field
          memory_selection:         # <- this mapping is a selection
            size: [62, 62]
            start: [1, 1]
          #! [decl_hdf5_h5selection]

decl_hdf5_h5selection_size:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      datasets:
        field: {type: array, subtype: double, size: [62, 62]}
      write:
        field:
          memory_selection:
            #! [decl_hdf5_h5selection_size]
            size: [62, 62]            # <- 62x62 elements
            start: [1, 1]
            #! [decl_hdf5_h5selection_size]

decl_hdf5_h5selection_start:
  metadata:
    iter: int
    nb_iter: int
  data:
    field: {type: array, subtype: double, size: [64, 64]}
  plugins:
    decl_hdf5:
      file: output.h5
      datasets:
        field: {type: array, subtype: double, size: [62, 62]}
      write:
        field:
          memory_selection:
            #! [decl_hdf5_h5selection_start]
            size: [62, 62]
            start: [1, 1]             # <- skip the first row and column
            #! [decl_hdf5_h5selection_start]

