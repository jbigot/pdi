metadata:
  rank: int
  nprocs: int
  size: {type: array, subtype: int, size: 2}
  iter: int
data:
  field: {type: array, subtype: double, size: ['$size[0] + 2', '$size[1] + 2']}
plugins:
  #! [decl_hdf5]
  decl_hdf5:
    file: output_${rank}.h5
    datasets:
      'field_[0-9]+':            # field_0, field_1...
        type: array
        subtype: float
        size: ['$size[0] + 2', '$size[1] + 2']
    write:
      field:
        dataset: field_${iter}
  #! [decl_hdf5]
