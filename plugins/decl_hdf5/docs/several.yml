metadata:
  rank: int
  nprocs: int
  size: {type: array, subtype: int, size: 2}
  iter: int
data:
  field: {type: array, subtype: double, size: ['$size[0] + 2', '$size[1] + 2']}
plugins:
  #! [decl_hdf5]
  decl_hdf5:
    file: output_${rank}.h5
    write:
      field:
        - dataset: field_last    # at each iteration
        - dataset: field_${iter} # and at the even ones
          when: $iter % 2 = 0
  #! [decl_hdf5]
