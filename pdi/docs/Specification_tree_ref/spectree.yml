# The examples of the specification tree reference (Specification_tree_ref.md), one whole specification tree per key, that the page shows the
# marked part of.
# tests/combination_tests/doc_spectree.cxx initializes PDI with each of them, from a copy of this directory, where the files they include are.

spectree_pdi:
  #! [spectree_pdi]
  include: common.yml          # more of the tree, from another file
  logging: info                # the logger of PDI
  types:
    vector3_t: {type: array, subtype: double, size: 3}
  metadata:
    iter: int
  data:
    position: vector3_t
  plugin_path: /opt/pdi/plugins
  plugins:
    trace: ~
  #! [spectree_pdi]

spectree_pdi_include:
  #! [spectree_pdi_include]
  include: common.yml   # <- reads common.yml as if its content were here
  data:
    field: double
  #! [spectree_pdi_include]

spectree_pdi_logging:
  #! [spectree_pdi_logging]
  logging: debug        # <- PDI logs what it does in detail
  data:
    field: double
  #! [spectree_pdi_logging]

spectree_pdi_types_type_name:
  #! [spectree_pdi_types_type_name]
  types:
    vector3_t: {type: array, subtype: double, size: 3}   # <- defines vector3_t...
  data:
    position: vector3_t                                 # ... used here
    velocity: vector3_t
  #! [spectree_pdi_types_type_name]

spectree_pdi_metadata_data_name:
  #! [spectree_pdi_metadata_data_name]
  metadata:
    iter: int               # <- PDI keeps a copy of iter at each share
  data:
    field: {type: array, subtype: double, size: 64}
  plugins:
    decl_hdf5:
      file: field_${iter}.h5   # so that it can use it afterwards
      write: [field]
  #! [spectree_pdi_metadata_data_name]

spectree_pdi_data_data_name:
  #! [spectree_pdi_data_data_name]
  data:
    field: {type: array, subtype: double, size: [64, 64]}   # <- PDI only references field while it is shared
  #! [spectree_pdi_data_data_name]

spectree_pdi_plugin_path:
  #! [spectree_pdi_plugin_path]
  plugin_path: [/home/user/pdi_plugins, /opt/pdi/plugins]   # <- searched in this order
  plugins:
    trace: ~
  #! [spectree_pdi_plugin_path]

spectree_pdi_plugins_plugin_name:
  data:
    field: double
  #! [spectree_pdi_plugins_plugin_name]
  plugins:
    trace: ~                # <- a plugin with no configuration
    decl_hdf5:              # <- a plugin with its configuration
      file: example.h5
      write: [field]
  #! [spectree_pdi_plugins_plugin_name]

spectree_pdi_plugins_plugin_name_logging:
  data:
    field: double
  #! [spectree_pdi_plugins_plugin_name_logging]
  plugins:
    decl_hdf5:
      logging: debug        # <- the logger of Decl'HDF5, independent from that of PDI
      file: example.h5
      write: [field]
  #! [spectree_pdi_plugins_plugin_name_logging]

spectree_logging:
  data:
    field: double
  #! [spectree_logging]
  logging: debug            # <- the scalar form, a level only
  plugins:
    decl_hdf5:
      logging:                # <- the mapping form
        level: warn
        output:
          file: decl_hdf5.log
      file: example.h5
      write: [field]
  #! [spectree_logging]

spectree_logging_level:
  logging:
    #! [spectree_logging_level]
    level: warn               # <- only warnings and errors
    #! [spectree_logging_level]

spectree_logging_pattern:
  plugins:
    mpi:
      logging:
        #! [spectree_logging_pattern]
        level: debug
        pattern: "[%{MPI_COMM_WORLD_rank:04d}][%n][%l] %v"   # <- prefixes each line with the MPI rank
        #! [spectree_logging_pattern]

spectree_logging_output_file:
  logging:
    #! [spectree_logging_output_file]
    level: info
    output:
      file: pdi.log           # <- the logs go to pdi.log, and no longer to the console
    #! [spectree_logging_output_file]

spectree_logging_output_console:
  logging:
    #! [spectree_logging_output_console]
    output:
      file: pdi.log
      console: on             # <- the logs go to pdi.log, and to the console too
    #! [spectree_logging_output_console]

spectree_include:
  #! [spectree_include]
  include:
    - common.yml            # <- an include directive, in its scalar form...
    - file: other.yml       # <- ... and in its mapping form
      subtree: .pdi
  #! [spectree_include]

spectree_include_file:
  include:
    #! [spectree_include_file]
    file: config/common.yml   # <- relative to the working directory, not to the including file
    subtree: ""
    #! [spectree_include_file]

spectree_include_subtree:
  include:
    #! [spectree_include_subtree]
    file: simulation.yml
    subtree: .pdi             # <- only the pdi key at the root of simulation.yml
    #! [spectree_include_subtree]
