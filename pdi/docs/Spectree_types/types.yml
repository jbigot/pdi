# The examples of the datatypes reference (Spectree_types.md), one whole specification tree per key, that the page shows the marked part of.
# pdi/tests/PDI_doc_datatype.cxx initializes PDI with each of them, and shares each of their data, so that their datatypes are evaluated.
# The Fortran types, those of the keys that start with spectree_fortran, are only checked when PDI is built with Fortran support.

spectree_datatype:
  #! [spectree_datatype]
  data:
    iter: int                       # <- a datatype in its scalar form...
    field:                          # <- ... and in its mapping form
      type: array
      subtype: double
      size: [64, 64]
  #! [spectree_datatype]

spectree_datatype_type:
  data:
    value:
      #! [spectree_datatype_type]
      type: int64               # <- a 64-bit signed integer
      #! [spectree_datatype_type]

spectree_datatype_attribute_name:
  data:
    field:
      #! [spectree_datatype_attribute_name]
      type: array
      subtype: double
      size: [64, 64]
      +decl_hdf5.chunking: [16, 64]   # <- an attribute, read by the Decl'HDF5 plugin
      #! [spectree_datatype_attribute_name]

spectree_fortran:
  #! [spectree_fortran]
  data:
    temperature: {type: real, kind: 8}            # <- a real(kind=8)
    flags:
      type: array
      subtype: {type: logical, kind: 1}           # <- a logical(kind=1)
      size: 10
  #! [spectree_fortran]

spectree_fortran_kind:
  data:
    count:
      #! [spectree_fortran_kind]
      type: integer
      kind: 8                   # <- an integer(kind=8)
      #! [spectree_fortran_kind]

spectree_array:
  metadata:
    height: int
    width: int
  #! [spectree_array]
  data:
    field:                  # <- an array
      type: array
      subtype: double
      size: [$height, $width]
  #! [spectree_array]

spectree_array_size:
  metadata:
    height: int
    width: int
  data:
    field:
      #! [spectree_array_size]
      type: array
      subtype: double
      size: [$height, $width]   # <- two dimensions, from metadata
      #! [spectree_array_size]

spectree_array_subtype:
  data:
    vectors:
      #! [spectree_array_subtype]
      type: array
      size: 10
      subtype:                  # <- an array of 10 vectors of 3 doubles
        type: array
        size: 3
        subtype: double
      #! [spectree_array_subtype]

spectree_array_subsize:
  data:
    field:
      #! [spectree_array_subsize]
      type: array
      subtype: double
      size: [12, 12]
      subsize: [10, 10]         # <- only the 10x10 interior...
      start: [1, 1]             #    ... after the first row and column
      #! [spectree_array_subsize]

spectree_array_start:
  data:
    field:
      #! [spectree_array_start]
      type: array
      subtype: double
      size: [12, 12]
      subsize: [10, 10]
      start: [1, 1]             # <- the interior starts at the second row and column
      #! [spectree_array_start]

spectree_array_order:
  data:
    field:
      #! [spectree_array_order]
      type: array
      subtype: double
      size: [12, 12]
      order: C                  # <- the only value, and the default
      #! [spectree_array_order]

spectree_pointer:
  #! [spectree_pointer]
  data:
    buffer:                 # <- a pointer to a double
      type: pointer
      subtype: double
  #! [spectree_pointer]

spectree_pointer_subtype:
  data:
    name:
      #! [spectree_pointer_subtype]
      type: pointer
      subtype: {type: array, subtype: char, size: 256}   # <- a pointer to a string of 256 characters
      #! [spectree_pointer_subtype]

spectree_record:
  #! [spectree_record]
  data:
    particle:               # <- a record of two members, with explicit offsets
      type: record
      buffersize: 16
      members:
        position: {disp: 0, type: double}
        id: {disp: 8, type: int64}
  #! [spectree_record]

spectree_record_buffersize:
  data:
    counter:
      #! [spectree_record_buffersize]
      type: record
      buffersize: 16            # <- 16 bytes, padding included
      members:
        value: {disp: 0, type: double}
        count: {disp: 8, type: int32}
      #! [spectree_record_buffersize]

spectree_record_members_member_name:
  data:
    counter:
      #! [spectree_record_members_member_name]
      type: record
      buffersize: 16
      members:
        value: {disp: 0, type: double}   # <- a member named value
        count: {disp: 8, type: int64}
      #! [spectree_record_members_member_name]

spectree_record_members_member_name_disp:
  data:
    counter:
      #! [spectree_record_members_member_name_disp]
      type: record
      buffersize: 16
      members:
        value: {disp: 0, type: double}
        count: {disp: 8, type: int64}    # <- 8 bytes after the start of the record
      #! [spectree_record_members_member_name_disp]

spectree_struct:
  #! [spectree_struct]
  data:
    particle:               # <- a struct, laid out as C does
      type: struct
      members:
        - position: double
        - id: int64
  #! [spectree_struct]

spectree_struct_members:
  data:
    point:
      #! [spectree_struct_members]
      type: struct
      members:                  # <- the members, in order
        - x: double
        - y: double
      #! [spectree_struct_members]

spectree_struct_members_item_member_name:
  data:
    node:
      #! [spectree_struct_members_item_member_name]
      type: struct
      members:
        - x: double
        - neighbors: {type: array, subtype: int, size: 4}   # <- a member named neighbors, of an array type
      #! [spectree_struct_members_item_member_name]

spectree_tuple:
  #! [spectree_tuple]
  data:
    pair:                   # <- a tuple of an int32 and a double
      type: tuple
      elements: [int32, double]
  #! [spectree_tuple]

spectree_tuple_buffersize:
  data:
    pair:
      #! [spectree_tuple_buffersize]
      type: tuple
      buffersize: 16            # <- required with explicit displacements
      elements:
        - {disp: 0, type: int32}
        - {disp: 8, type: double}
      #! [spectree_tuple_buffersize]

spectree_tuple_elements:
  data:
    pair:
      #! [spectree_tuple_elements]
      type: tuple
      elements: [int32, double] # <- the elements, in order
      #! [spectree_tuple_elements]

spectree_tuple_elements_item:
  data:
    pair:
      #! [spectree_tuple_elements_item]
      type: tuple
      elements:
        - int32
        - {type: array, subtype: double, size: 3}   # <- an element of an array type
      #! [spectree_tuple_elements_item]

spectree_tuple_elements_item_disp:
  data:
    pair:
      #! [spectree_tuple_elements_item_disp]
      type: tuple
      buffersize: 16
      elements:
        - {disp: 0, type: int32}
        - {disp: 8, type: double}   # <- 8 bytes after the start of the tuple
      #! [spectree_tuple_elements_item_disp]
