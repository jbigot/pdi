# The file the \ref YAML examples parse, yaml_examples.c and yaml_examples.f90.
# It holds both forms the page shows: a whole tree for PDI at its root, and the configuration of a simulation with a subtree for PDI; PDI
# ignores the keys of the simulation at its root.

#! [whole_file]
metadata:
  iteration: int
data:
  main_field: double
plugins:
  trace:
       # ...
#! [whole_file]

#! [subtree]
duration: 0.75
size: [64, 64]
parallelism: { height: 4, width: 4 }

# only the following config will be passed to PDI
pdi_subtree:
  metadata:
    iteration: int
  data:
    main_field: double
  plugins:
    trace:
       # ...
#! [subtree]
